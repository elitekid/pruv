# Pruv M3 (C4) Rust workspace. Design: docs/M3_C4_SPEC.md §2.
# Dependency versions are written directly in each crate's Cargo.toml instead of using [workspace.dependencies].
# crates/pruvc is created by another worker (until then this workspace does not load).
[workspace]
resolver = "2"
members = ["crates/pruv-core", "crates/pruv-proof", "crates/pruvc"]

[profile.release]
lto = "thin"
strip = true
