# Pruv M3 (C4) Rust workspace. 설계: docs/M3_C4_SPEC.md 2절.
# 의존 버전은 [workspace.dependencies] 를 쓰지 않고 각 크레이트 Cargo.toml 에 직접 적는다.
# crates/pruvc 는 다른 작업자가 만든다(그 전에는 이 workspace 가 로드되지 않는다).
[workspace]
resolver = "2"
members = ["crates/pruv-core", "crates/pruv-proof", "crates/pruvc"]

[profile.release]
lto = "thin"
strip = true
