[package]
name = "pruvc"
version = "0.0.1"
edition = "2021"
description = "Pruv compiler (Rust port): LLVM object/link layer and dev-only pruvc-ir-tool"
autobins = false
build = "build.rs"

[lib]
name = "pruvc"
path = "src/lib.rs"

# 실제 CLI(M3 5단계)와 개발용 도구.
[[bin]]
name = "pruvc"
path = "src/main.rs"

[[bin]]
name = "pruvc-ir-tool"
path = "src/bin/pruvc-ir-tool.rs"

[dependencies]
pruv-core = { path = "../pruv-core" }
pruv-proof = { path = "../pruv-proof" }
llvm-sys = { version = "=221.1.2", features = ["force-static"] }
tempfile = "=3.27.0"

[build-dependencies]
cc = "=1.11.1"
