[package]
name = "pruv-proof"
version = "0.0.0"
edition = "2021"
publish = false
description = "Pruv z3 증명 층. 0B: 실의무 시제품(pruv-proof-spike)."

# 정확 버전은 0B 마무리에서 메인이 Cargo.lock 을 보고 고정한다(ci/m3/README.md 절차).
[dependencies]
# 사양 고정값(M3_C4_SPEC 2절). 시스템 libz3 에 의존하지 않도록 vendored.
z3 = { version = "=0.22.0", features = ["vendored"] }
z3-src = "=503.3.0"
# src/sys.rs 가 직접 부르는 저수준 바인딩. =0.14.1 고정(z3 0.22.0 이 쓰는 버전, Cargo.lock 한 벌).
# 버전이 어긋나면 z3-sys/z3-src 가 두 벌 빌드되므로 `cargo tree -d` 로 잡는다(README 3단계).
z3-sys = { version = "=0.14.1", features = ["vendored"] }
serde_json = "=1.0.154"
# 3단계: 파서·검사기·오류/JSON 출력기(pyjson)
pruv-core = { path = "../pruv-core" }

[[bin]]
name = "pruv-proof-spike"
path = "src/bin/pruv-proof-spike.rs"

[[bin]]
name = "pruv-trace-dump"
path = "src/bin/pruv-trace-dump.rs"
