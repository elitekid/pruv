[package]
name = "pruv-proof"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Pruv z3 proof layer. 0B: real-obligation prototype (pruv-proof-spike)."

# The exact version is pinned by the main branch from Cargo.lock at the end of 0B (procedure in ci/m3/README.md).
[dependencies]
# Pinned by the spec (M3_C4_SPEC §2). vendored so we do not depend on the system libz3.
z3 = { version = "=0.22.0", features = ["vendored"] }
z3-src = "=503.3.0"
# Low-level bindings called directly by src/sys.rs. Pinned to =0.14.1 (the version z3 0.22.0 uses; a single copy in Cargo.lock).
# If versions drift, z3-sys/z3-src get built twice; catch it with `cargo tree -d` (README step 3).
z3-sys = { version = "=0.14.1", features = ["vendored"] }
serde_json = "=1.0.154"
# Step 3: parser, checker, error/JSON emitter (pyjson)
pruv-core = { path = "../pruv-core" }

[[bin]]
name = "pruv-proof-spike"
path = "src/bin/pruv-proof-spike.rs"

[[bin]]
name = "pruv-trace-dump"
path = "src/bin/pruv-trace-dump.rs"
