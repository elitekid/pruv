name: windows-abi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/abi/winci/**"
      - "pruvc/runtime.c"
      - ".github/workflows/windows-abi.yml"

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows-abi:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Tool versions
        shell: bash
        run: |
          clang --version
          rustc -vV
          python --version

      - name: Verify Windows x64 ABI execution
        shell: bash
        run: python tests/abi/winci/run_windows.py
