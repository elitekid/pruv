name: windows-abi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/abi/winci/**"
      - "pruvc/runtime.c"
      - ".github/workflows/windows-abi.yml"

jobs:
  windows-abi:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 도구 버전
        shell: bash
        run: |
          clang --version
          rustc -vV
          python --version

      - name: Windows x64 ABI 실행 확인
        shell: bash
        run: python tests/abi/winci/run_windows.py
