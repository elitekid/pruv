# Build and test the Rust compiler (pruvc-rs) on macOS, Linux and Windows.
#
# Per-OS setup
# - LLVM 22: llvm-sys (=221.1.2, force-static) needs llvm-config and the static LLVM libraries.
#     macOS   = Homebrew llvm@22 (same location as the README build instructions)
#     Linux   = llvm-22-dev and clang-22 from apt.llvm.org
#     Windows = official release archive clang+llvm-*-x86_64-pc-windows-msvc (has llvm-config and static .lib; cached)
# - z3 is vendored (z3-src), so every OS builds it from source. That is slow, so the cargo cache (rust-cache) is used.
# - The Python reference compiler (pruvc/pruvc.py) runs from .venv with z3-solver (tests/compiler_driver.py looks there).
#
# Tests left out on Windows, and why
# - run_all groups examples and runtime, and m3_all stages compilers, standalone, abi, abi_v2, abi_bool, abi_utf8:
#   they link the generated code into an executable and run it, and linking Windows executables is not supported
#   yet (see README). Running the Windows ABI is covered by the separate workflow windows-abi.yml.
# - Windows runs only the tests that need no linking: cargo test, run_all must_reject (programs that must be
#   rejected), and m3_all parse, check, trace, trace_infer, llvm, rust (comparison of the two compilers' output).

name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "22.1.8"
  Z3_SOLVER_VERSION: "5.3.3.0"

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      # ---------- LLVM 22 ----------
      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22 zstd
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -q
          sudo apt-get install -y -q llvm-22-dev libpolly-22-dev clang-22 lld-22 libzstd-dev zlib1g-dev libxml2-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          # The tests look up clang, opt and llvm-nm on PATH (they must read LLVM 22 IR).
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Cache LLVM 22 (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Download LLVM 22 (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          name="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc"
          curl -sSfL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${name}.tar.xz"
          mkdir -p /c/llvm
          tar -xf llvm.tar.xz -C /c/llvm --strip-components=1
          rm llvm.tar.xz

      # The official Windows LLVM lists libxml2 (xml2s.lib) in `llvm-config --system-libs`, but the archive does not
      # ship it. Only LLVM's Windows manifest code uses libxml2 and pruvc never calls it, so the linker pulls no
      # libxml2 symbol: an empty placeholder library is enough to satisfy the `xml2s.lib` input.
      - name: LLVM 22 paths and xml2s.lib placeholder (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "LLVM_SYS_221_PREFIX=C:\\llvm" >> "$GITHUB_ENV"
          echo "C:\\llvm\\bin" >> "$GITHUB_PATH"
          mkdir -p /c/xml2stub
          echo 'int pruv_xml2_placeholder;' > /c/xml2stub/stub.c
          /c/llvm/bin/clang-cl.exe -c /c/xml2stub/stub.c -Fo"C:\\xml2stub\\stub.obj"
          /c/llvm/bin/llvm-lib.exe -out:"C:\\xml2stub\\xml2s.lib" "C:\\xml2stub\\stub.obj"
          echo "RUSTFLAGS=-L native=C:\\xml2stub" >> "$GITHUB_ENV"

      # ---------- Python reference compiler ----------
      - name: Python reference environment (.venv + z3-solver)
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pip install -q "z3-solver==${Z3_SOLVER_VERSION}"
          "$py" -c "import z3; print('z3', z3.get_version_string())"

      # ---------- Build ----------
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pruvc-rs

      - name: Tool versions
        run: |
          rustc -vV
          "$LLVM_SYS_221_PREFIX/bin/llvm-config" --version
          python --version

      - name: Build (cargo build --release --locked)
        working-directory: pruvc-rs
        run: cargo build --release --locked

      - name: cargo test
        working-directory: pruvc-rs
        run: cargo test --release --locked --workspace

      # ---------- Tests: macOS and Linux (everything) ----------
      - name: run_all, both backends (compared with the saved row list)
        if: runner.os != 'Windows'
        run: python tests/run_all.py --backend both --compare-rows tests/run_all_rows.txt

      - name: m3_all, Python vs Rust comparison (--quick)
        if: runner.os != 'Windows'
        run: python tests/m3_all.py --quick --log-dir m3-logs

      # ---------- Tests: Windows (no linking; see the header comment) ----------
      - name: run_all must_reject (Windows)
        if: runner.os == 'Windows'
        run: python tests/run_all.py --only must_reject

      - name: m3_all stages without linking (Windows, --quick)
        if: runner.os == 'Windows'
        run: python tests/m3_all.py --quick --only parse,check,trace,trace_infer,llvm,rust --log-dir m3-logs

      - name: Upload m3_all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-logs-${{ matrix.os }}
          path: m3-logs
          if-no-files-found: ignore
