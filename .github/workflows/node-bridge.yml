# Node-API bridge (stage L1). Deliberately path-filtered and manual-dispatchable
# only: it builds on four OS runners, so it runs just when the bridge, the L0
# Pruv sources it is generated from (with the decode adapter and oracle), or this file change. No schedule and no
# pull_request trigger, to keep CI rare. ci.yml and windows-abi.yml are unchanged.
name: node-bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/node/**"
      - "bench/l0/*.pruv"
      - "bench/l0/decode_adapter/**"
      - "bench/l0/decode_oracle.py"
      - "bench/l0/decode_bytes.mjs"
      - "bench/l0/zip_total.mjs"
      - "bench/l0/run_zip_total.py"
      - "bench/l0/encode_png.mjs"
      - "bench/l0/run_encode_png.py"
      - "bench/l0/split_text.mjs"
      - "bench/l0/run_split_text.py"
      - "bench/l0/group_text.mjs"
      - "bench/l0/run_group_text.py"
      - "bench/l0/image_shrink.mjs"
      - "bench/l0/run_image_shrink.py"
      - "bench/l0/number_ranges.mjs"
      - "bench/l0/run_number_ranges.py"
      - "bench/l0/doc_labels.mjs"
      - "bench/l0/run_doc_labels.py"
      - "bench/l0/join_ranges.mjs"
      - "bench/l0/run_join_ranges.py"
      - "bench/l0/cut_cell.mjs"
      - "bench/l0/run_cut_cell.py"
      - "bench/l0/sheet_range.mjs"
      - "bench/l0/run_sheet_range.py"
      - "bench/l0/page_ranges.mjs"
      - "bench/l0/run_page_ranges.py"
      - "bench/l0/grouped_number.mjs"
      - "bench/l0/run_grouped_number.py"
      - "bench/l0/under_root.mjs"
      - "bench/l0/run_under_root.py"
      - "bench/l0/cap_keep.mjs"
      - "bench/l0/run_cap_keep.py"
      - "bench/l0/evict_stop.mjs"
      - "bench/l0/run_evict_stop.py"
      - "bench/l0/index_terms.mjs"
      - "bench/l0/run_index_terms.py"
      - "bench/l0/note_pairs.mjs"
      - "bench/l0/run_note_pairs.py"
      - "bench/l0/cell_date.mjs"
      - "bench/l0/run_cell_date.py"
      - "bench/l0/run_cell_str.py"
      - "bench/l0/run_cell_int.py"
      - "bench/l0/run_extract_version.py"
      - "bench/l0/chunk_page.mjs"
      - "bench/l0/run_chunk_page.py"
      - "bench/l0/image_counts.mjs"
      - "bench/l0/run_image_counts.py"
      - "bench/l0/text_lines.mjs"
      - "bench/l0/run_text_lines.py"
      - "bench/l0/luhn.mjs"
      - "bench/l0/run_luhn.py"
      - "bench/l0/chat_ref.mjs"
      - "bench/l0/run_chat_ref.py"
      - "bench/l0/toml_string.mjs"
      - "bench/l0/run_toml_string.py"
      - "bench/l0/strip_user_info.mjs"
      - "bench/l0/run_strip_user_info.py"
      - "bench/l0/valid_thread.mjs"
      - "bench/l0/run_valid_thread.py"
      - "bench/l0/clip_chars.mjs"
      - "bench/l0/run_clip_chars.py"
      - "bench/l0/align_offset.mjs"
      - "bench/l0/run_align_offset.py"
      - "bench/l0/stamp.mjs"
      - "bench/l0/run_stamp.py"
      - "bench/l0/one_line.mjs"
      - "bench/l0/run_one_line.py"
      - "bench/l0/clip_sheet.mjs"
      - "bench/l0/run_clip_sheet.py"
      - "bench/l0/kind_of.mjs"
      - "bench/l0/run_kind_of.py"
      - "bench/l0/row_pieces.mjs"
      - "bench/l0/run_row_pieces.py"
      - "bench/l0/sheet_chunks.mjs"
      - "bench/l0/run_sheet_chunks.py"
      - "bench/l0/text_around.mjs"
      - "bench/l0/run_text_around.py"
      - "bench/l0/parse_html.mjs"
      - "bench/l0/run_parse_html.py"
      - "bench/l0/docx_parts.mjs"
      - "bench/l0/run_docx_parts.py"
      - "bench/l0/tokenize.mjs"
      - "bench/l0/run_tokenize.py"
      - "bench/l0/tokenize_ucd.py"
      - "bench/l0/gen_tokenize_tables.py"
      - "bench/l0/data/**"
      - ".github/workflows/node-bridge.yml"

env:
  PYTHONUTF8: "1"
  Z3_SOLVER_VERSION: "5.3.3.0"  # same value as ci.yml

concurrency:
  group: node-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-24.04
    # Builds pruvc-rs and proves every bridge source with both compilers.
    # The first run builds vendored z3 and links static LLVM (slow); later runs hit the cargo cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -q "z3-solver==${Z3_SOLVER_VERSION}"
        shell: bash
      # pruvc-rs links LLVM 22 through llvm-sys; same packages as the Linux job of ci.yml.
      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -q
          sudo apt-get install -y -q llvm-22-dev libpolly-22-dev clang-22 lld-22 libzstd-dev zlib1g-dev libxml2-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pruvc-rs
          cache-on-failure: true
      # Build in pruvc-rs/target, which regen.py uses directly (and the cache keeps).
      - name: Build pruvc-rs
        working-directory: pruvc-rs
        run: cargo build --release --locked
      - run: python bridge/node/regen.py --check

  build:
    needs: regen
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          rustup show
          rustc -vV
      - run: node bridge/node/build.mjs
      - run: node bridge/node/test.mjs
