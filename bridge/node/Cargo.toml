[package]
name = "pruv-node-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

# Keep this crate out of any parent workspace.
[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
